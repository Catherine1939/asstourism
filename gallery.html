  Purpose: Masonry-style CSS grid gallery with category filters and a
           custom lightbox (prev/next, keyboard, swipe, counter).

  Date: 2026-11

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo gallery of Lesotho — landscapes, Basotho culture, wildlife and adventure.">
  <meta name="theme-color" content="#0B2A4A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2300209F' d='M8 0l8 9H0z'/%3E%3C/svg%3E">
  <title>Gallery — Kingdom in the Sky</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">

  <main id="main">
    <section class="page-banner" aria-labelledby="pageTitle">
      <div class="container-x">
        <p class="eyebrow text-white" style="color:var(--accent)">Gallery</p>
        <h1 id="pageTitle">Lesotho in pictures</h1>
        <p class="lead">Eighteen images across landscapes, culture, wildlife and adventure.</p>
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb kingdom-crumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Gallery</li>
          </ol>
        </nav>
      </div>
    </section>

    <section class="section">
      <div class="container-x">
        <div id="galleryFilters" class="d-flex flex-wrap gap-2 justify-content-center mb-4 reveal" role="group" aria-label="Gallery filters">
          <button class="btn btn-kingdom btn-sm" data-cat="All">All</button>
          <button class="btn btn-outline-kingdom btn-sm" data-cat="Landscapes">Landscapes</button>
          <button class="btn btn-outline-kingdom btn-sm" data-cat="Culture">Culture</button>
          <button class="btn btn-outline-kingdom btn-sm" data-cat="Wildlife">Wildlife</button>
          <button class="btn btn-outline-kingdom btn-sm" data-cat="Adventure">Adventure</button>
        </div>
        <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
        <p class="text-muted small mt-3"><i class="bi bi-info-circle"></i> Photos are real images of Lesotho from Wikimedia Commons (free licence). Click any image to open the lightbox — use arrow keys or swipe.</p>
      </div>
    </section>
  </main>

  <!-- Custom lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close lightbox"><i class="bi bi-x-lg"></i></button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image"><i class="bi bi-chevron-left"></i></button>
    <img id="lbImage" src="" alt="">
    <p class="lb-caption" id="lbCaption"></p>
    <p class="lb-counter" id="lbCounter"></p>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image"><i class="bi bi-chevron-right"></i></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/includes.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/gallery.js" defer></script>
</body>
</html>
