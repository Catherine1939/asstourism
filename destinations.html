  Purpose: Browse all destinations with live search, category filters,
           sort, pagination, and a details modal that pre-fills booking.

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Lesotho's destinations — Maletsunyane Falls, Thaba-Bosiu, Katse Dam, Sani Pass and more.">
  <meta name="theme-color" content="#0B2A4A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2300209F' d='M8 0l8 9H0z'/%3E%3C/svg%3E">
  <title>Destinations — Kingdom in the Sky</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="destinations">

  <main id="main">
    <!-- Page banner + breadcrumb -->
    <section class="page-banner" aria-labelledby="pageTitle">
      <div class="container-x">
        <p class="eyebrow text-white" style="color:var(--accent)">Explore</p>
        <h1 id="pageTitle">Destinations</h1>
        <p class="lead">Thirteen places to discover across the Mountain Kingdom.</p>
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb kingdom-crumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Destinations</li>
          </ol>
        </nav>
      </div>
    </section>

    <section class="section">
      <div class="container-x">
        <!-- Controls: search, filter, sort -->
        <div class="row g-3 align-items-center mb-4 reveal">
          <div class="col-lg-5">
            <label for="destSearch" class="visually-hidden">Search destinations</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
              <input type="search" id="destSearch" class="form-control border-start-0" placeholder="Search by name, district or keyword…">
            </div>
          </div>
          <div class="col-lg-4">
            <div id="filterBtns" class="d-flex flex-wrap gap-2" role="group" aria-label="Category filters">
              <button class="btn btn-kingdom btn-sm" data-cat="All">All</button>
              <button class="btn btn-outline-kingdom btn-sm" data-cat="Waterfalls">Waterfalls</button>
              <button class="btn btn-outline-kingdom btn-sm" data-cat="Mountains">Mountains</button>
              <button class="btn btn-outline-kingdom btn-sm" data-cat="Culture & History">Culture</button>
              <button class="btn btn-outline-kingdom btn-sm" data-cat="Nature Reserves">Reserves</button>
              <button class="btn btn-outline-kingdom btn-sm" data-cat="Dams & Lakes">Dams</button>
            </div>
          </div>
          <div class="col-lg-3">
            <label for="sortSelect" class="visually-hidden">Sort</label>
            <select id="sortSelect" class="form-select">
              <option value="az">Sort: A to Z</option>
              <option value="za">Sort: Z to A</option>
            </select>
          </div>
        </div>

        <!-- Destination grid: breakpoints col-12 col-sm-6 col-lg-4 -->
        <div class="row g-4" id="destGrid" aria-live="polite"></div>

        <!-- Pagination -->
        <nav aria-label="Destination pages" class="mt-4">
          <ul class="pagination kingdom-page justify-content-center" id="pagination"></ul>
        </nav>
      </div>
    </section>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="destModal" tabindex="-1" aria-labelledby="destModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content kingdom-modal">
        <div class="modal-header">
          <h2 class="modal-title h4" id="destModalTitle">Destination</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="destModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/includes.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/destinations.js" defer></script>
</body>
</html>
